<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Mailfree — 简洁、私有的 Cloudflare 域名临时邮箱。" />
    <script src="/theme-init.js"></script>
    <link rel="stylesheet" href="/theme-init.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 字体异步加载：避免外部字体请求挂起时阻塞首屏渲染导致白屏 -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Mailfree</title>
  </head>
  <body>
    <!-- 应用挂载前的加载占位：React 启动后会替换此内容 -->
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:14px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;color:#8a8a90;background:#fafafa;">
        <div style="width:22px;height:22px;border:2px solid #d8d8de;border-top-color:#6b6b74;border-radius:50%;animation:mf-boot-spin .8s linear infinite;"></div>
        正在加载…
      </div>
      <style>@keyframes mf-boot-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
