<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>临时邮箱</title>
    <!-- 运行时注入域名列表（从 env.MAIL_DOMAIN 解析），用于前端域名选择 -->
    <meta name="mail-domains" content="">
    <link rel="preload" href="/html/app.html" as="fetch" crossorigin>
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml" />

    <!-- Google Fonts: DM Sans + Noto Sans SC (OmniMail 风格字体系统) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/app-sidebar.css" />
    <link rel="stylesheet" href="/css/app-mailbox.css" />
    <link rel="stylesheet" href="/css/app-compose.css" />
    <link rel="stylesheet" href="/css/app-modal.css" />
    <link rel="stylesheet" href="/css/app-responsive.css" />
    <link rel="stylesheet" href="/css/app-mobile.css" media="(max-width: 900px)" />
    <!-- 暗黑模式样式 -->
    <link rel="stylesheet" href="/css/app_black.css" />
    <link rel="stylesheet" href="/css/app-mobile_black.css" media="(max-width: 900px)" />
    <link rel="stylesheet" href="/css/rebirth.css" />
    <!-- 主题切换支持 -->
    <script src="/js/theme-toggle.js"></script>

    <!-- SVG Icons Sprite (Replace Emoji Icons) -->
    <link rel="preload" href="/icons/sprites.svg" as="image" type="image/svg+xml" crossorigin>
    <script src="/js/toast-utils.js"></script>
    <script src="/js/mock.js"></script>
    <!-- 提前内联保存 hash，保证最早阶段即可保留路由信息 -->
    <script>
      try{ if (location.hash){ sessionStorage.setItem('mf:preservedHash', location.hash); } }catch(_){ }
    </script>
    <script src="/js/auth-guard.js"></script>
    <script src="/js/app-router.js" defer></script>
  </head>
  <body>
    <!-- SVG Icon Sprites -->
    <svg style="display:none">
      <use href="/icons/sprites.svg#icon-mail"/>
    </svg>

    <div id="app"></div>
    <script>
      // 路由守卫：优先使用 loading 页面进行权限检查，避免登录页闪屏
      (function() {
        // 加载主应用脚本（含移动端脚本），并标记近期已验证
        function loadApp() {
          try {
            sessionStorage.setItem('auth_checked', 'true');
            sessionStorage.setItem('auth_checked_ts', String(Date.now()));
          } catch (_) { }
          var s = document.createElement('script');
          s.type = 'module';
          s.src = '/js/app.js';
          document.body.appendChild(s);
          try {
            if (window.matchMedia && window.matchMedia('(max-width: 900px)').matches) {
              var sm = document.createElement('script');
              sm.type = 'module';
              sm.src = '/js/app-mobile.js';
              document.body.appendChild(sm);
            }
          } catch (_) { }
        }

        // 带 AbortController 的会话探测；onSession(session) 成功，onFail() 失败/超时
        function checkSession(timeoutMs, onSession, onFail) {
          var controller = new AbortController();
          var tid = setTimeout(function () { try { controller.abort(); } catch (_) { } }, timeoutMs);
          fetch('/api/session', {
            headers: { 'Cache-Control': 'no-cache' },
            signal: controller.signal,
            credentials: 'include'
          }).then(function (r) {
            clearTimeout(tid);
            if (!r || !r.ok) return onFail(r);
            return r.json().then(function (s) {
              if (s && s.role === 'mailbox') { window.location.replace('/html/mailbox.html'); return; }
              onSession(s);
            });
          }).catch(function () { clearTimeout(tid); onFail(); });
        }

        function hasCookie() {
          try {
            return document.cookie.split(';').some(function (c) { return c.trim().indexOf('iding-session=') === 0; });
          } catch (_) { return false; }
        }

        function gotoLoading() { window.location.replace('/templates/loading.html?redirect=/'); }
        function gotoLogin() { window.location.replace('/html/login.html'); }

        try {
          // 是否地址栏直达/刷新
          var isDirectAccess = !document.referrer || window.history.length <= 1;

          // 近期认证标记（10秒内）可跳过重复检查
          var ts = 0;
          try { ts = Number(sessionStorage.getItem('auth_checked_ts') || '0'); } catch (_) { }
          var recentlyChecked = ts && (Date.now() - ts) < 10000;

          // 最近已验证过：直接加载应用
          if (recentlyChecked && !isDirectAccess) {
            loadApp();
            return;
          }

          if (isDirectAccess) {
            // 已有 Cookie：快速校验，避免登录页闪屏
            if (hasCookie()) {
              checkSession(3000,
                function () { loadApp(); },
                function () { loadApp(); } // 失败/超时也让应用内部处理，避免闪烁
              );
              return;
            }
            // 无 Cookie：显示 loading 并校验
            var loadingDiv = document.createElement('div');
            loadingDiv.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f5f5f7;z-index:9999"><div style="text-align:center"><div style="width:58px;height:58px;margin:0 auto 18px;background:#1d1d1f;border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(29,29,31,0.15)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><div style="width:36px;height:36px;border:2px solid rgba(29,29,31,0.1);border-top-color:#1d1d1f;border-radius:50%;animation:spin 800ms linear infinite;margin:0 auto"></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div></div>';
            document.body.appendChild(loadingDiv);
            checkSession(2500,
              function (s) { if (loadingDiv) loadingDiv.remove(); loadApp(); },
              function () { gotoLoading(); }
            );
          } else {
            // 非直达：快速权限检查
            var cookieExists = hasCookie();
            checkSession(2000,
              function () { loadApp(); },
              function () {
                if (cookieExists) { loadApp(); } else { gotoLogin(); }
              }
            );
          }
        } catch (_) {
          gotoLoading();
        }
      })();
    </script>
  </body>
  </html>
