<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>加载中 - 临时邮箱</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- 主题切换支持 -->
    <script src="/js/theme-toggle.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "DM Sans", "Noto Sans SC", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #ffffff;
        min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #111111; position: relative; overflow-x: hidden;
      }
      footer{ position: fixed; bottom: 10px; left: 0; right: 0; text-align: center; color: #999999; font-size: 12px; pointer-events: none; }
      .loading-container { text-align: center; padding: 2rem; background: #ffffff; border-radius: 8px; border: 1px solid #eeeeee; position: relative; z-index: 1; }
      .logo { font-size: 4rem; margin-bottom: 1rem; color: #000000; }
      .title { font-size: 1.5rem; margin-bottom: 1rem; font-weight: 700; color: #111111; letter-spacing: -0.02em; }
      .spinner { width: 32px; height: 32px; border: 2px solid #eeeeee; border-top: 2px solid #000000; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
      .status { font-size: 0.9rem; color: #666666; margin-bottom: 0.5rem; font-weight: 500; }
      .progress { width: 200px; height: 4px; background: #eeeeee; border-radius: 2px; margin: 0 auto; overflow: hidden; }
      .progress-bar { height: 100%; background: #000000; border-radius: 2px; animation: progress 2s ease-in-out infinite; }
      @keyframes spin { to { transform: rotate(360deg);} }
      @keyframes progress { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }

      :root.dark body {
        background: #000000;
        color: #ffffff;
      }
      :root.dark footer {
        color: #666666;
      }
      :root.dark .loading-container {
        background: #0a0a0a;
        border: 1px solid #1a1a1a;
      }
      :root.dark .logo {
        color: #ffffff;
      }
      :root.dark .title {
        color: #ffffff;
      }
      :root.dark .spinner {
        border-color: #1a1a1a;
        border-top-color: #ffffff;
      }
      :root.dark .status {
        color: #999999;
      }
      :root.dark .progress {
        background: #1a1a1a;
      }
      :root.dark .progress-bar {
        background: #ffffff;
      }
    </style>
    <link rel="stylesheet" href="/css/rebirth.css" />
  </head>
  <body>
    <div class="loading-container">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <use href="/icons/sprites.svg#icon-mail"/>
        </svg>
      </div>
      <h1 class="title">临时邮箱</h1>
      <div class="spinner"></div>
      <div class="status">请稍候...</div>
      <div class="progress"><div class="progress-bar"></div></div>
    </div>
    <div id="footer-slot"></div>
    <script src="/js/auth-guard.js" data-autorun="loading"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // 根据 URL 查询参数自定义状态文案：?status=...
        try {
          const u = new URL(location.href);
          const s = (u.searchParams.get('status') || '').trim();
          if (s) {
            const el = document.querySelector('.status');
            if (el) el.textContent = s;
          }
        } catch(_){ }
        (async function(){
          try{
            const res = await fetch('/templates/footer.html', { cache: 'no-cache' });
            const html = await res.text();
            const slot = document.getElementById('footer-slot');
            if (slot){ slot.outerHTML = html; setTimeout(()=>{ const y=document.getElementById('footer-year'); if (y) y.textContent = new Date().getFullYear(); },0); }
          }catch(_){ }
        })();
        // 预加载首页关键资源（模板和脚本），认证后可无缝切换
        try{ fetch('/templates/app.html', { cache: 'force-cache' }); }catch(_){ }
        try{
          const link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'script';
          link.href = '/js/app.js';
          document.head.appendChild(link);
        }catch(_){ }
        // 已认证用户兜底重定向：检测 Cookie 则确保跳往目标（更短延时）
        try{
          var hasToken = document.cookie.split(';').some(function(c){ return c.trim().indexOf('iding-session=') === 0; });
          if (hasToken){
            var target = (function(){ try{ var u=new URL(location.href); return u.searchParams.get('redirect')||'/'; }catch(_){ return '/'; }})();
            // 减少延时时间
            setTimeout(function(){ try{ location.replace(target); }catch(_){ location.replace('/'); } }, 100);
          }
        }catch(_){ }
      });
    </script>
  </body>
</html>
