<style id="toast-style">
.toast{
  position: fixed;
  top: 24px;
  left: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 400px;
  pointer-events: none;
}

.toast-item{
  background: #ffffff;
  color: #111111;
  border: 1px solid #eeeeee;
  border-radius: 8px;
  padding: 14px 18px;
  min-width: 300px;
  font-weight: 500;
  line-height: 1.5;
  font-size: 14px;
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  overflow: hidden;
  transform: translateX(-100%);
  animation: slideInLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.toast-item::before{
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: #000000;
}

.toast-item.warn::before{
  background: #666666;
}

.toast-icon{
  font-size: 16px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  color: #111111;
  font-family: 'Arial Unicode MS', Arial, sans-serif;
}

.toast-message{
  flex: 1;
}

@keyframes slideInLeft {
  from { transform: translateX(-100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

@keyframes slideOutLeft {
  from { transform: translateX(0); opacity: 1; }
  to { transform: translateX(-100%); opacity: 0; }
}

@media (max-width: 768px){
  .toast{
    left: 12px;
    right: 12px;
    top: 12px;
    max-width: none;
  }
  .toast-item{
    min-width: 0;
    padding: 12px 14px;
  }
}

@media (prefers-color-scheme: dark){
  .toast-item{
    background: #0a0a0a;
    color: #ffffff;
    border-color: #1a1a1a;
  }
  .toast-item::before{
    background: #ffffff;
  }
  .toast-item.warn::before{
    background: #999999;
  }
  .toast-icon{
    color: #ffffff;
  }
}
</style>
<div class="toast-item {{type}}">
	<span class="toast-icon">{{icon}}</span>
	<span class="toast-message">{{message}}</span>
</div>
